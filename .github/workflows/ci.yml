name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests
        # conftest.py supplies dummy Supabase settings; no test reaches the
        # network or a real database.
        run: pytest -q

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # --- Deployment -----------------------------------------------------------
  # Runs on the OCI VM itself via a self-hosted runner. That choice is not
  # incidental: the alternative — SSH from a GitHub-hosted runner — means
  # storing a private key here AND opening port 22 to GitHub's dynamic IP
  # ranges, which on a box holding financial records is a poor trade. A polling
  # runner needs no inbound access and no key in this repository.
  deploy:
    name: Deploy to production
    needs: [backend, frontend]
    # Never from a pull request, and never from another branch. `needs` already
    # means a red test cannot reach this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # Auto-created on first run. Add a required reviewer here to turn this into
    # a one-click approval gate rather than push-and-pray.
    environment: production
    concurrency:
      # Deploys must queue, never overlap, and never be cancelled half-done —
      # an interrupted deploy leaves no container running at all.
      group: deploy-production
      cancel-in-progress: false

    env:
      IMAGE: rags2riches
      CONTAINER: rags2riches
      PORT_BIND: 127.0.0.1:7860:7860
      # Absolute path to the production .env ON THE VM, outside any checkout.
      # It holds APP_ENCRYPTION_KEY and SUPABASE_SERVICE_KEY, so it lives where
      # only the runner user can read it and is never committed.
      ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}

    steps:
      # Builds from the runner's own workspace rather than a checkout shared
      # with a human user. That avoids the permission problem entirely — a repo
      # under /home/<someone> is unreadable to the runner because Ubuntu ships
      # home directories at 750 — and it keeps working if this repository is
      # ever made private, because the action authenticates and a bare
      # `git fetch` in a foreign checkout would not.
      - uses: actions/checkout@v5
        with:
          # .gitattributes puts *.png in Git LFS, and checkout does not fetch
          # LFS objects unless asked. Without this the runner gets pointer text
          # files where the app icons should be, and `expo export` dies inside
          # Jimp with "Could not find MIME for Buffer <null>" — a message that
          # says nothing about LFS. Manual builds on the VM never hit it,
          # because that clone has the real files.
          lfs: true

      # `lfs: true` fetches the objects into .git/lfs, which is not the same as
      # writing them into the working tree. This runner reuses its workspace,
      # and the first run cloned before LFS was configured — so the PNGs were
      # written as pointer stubs, and no later checkout rewrote them because
      # their content had not changed between commits. Fetched objects, stub
      # files, and `expo export` dying inside Jimp on a text file it was told
      # was an image.
      #
      # `git lfs pull` is fetch plus checkout, and is idempotent, so it costs
      # nothing on a workspace that is already correct.
      - name: Materialise LFS files
        run: |
          set -euo pipefail
          git lfs pull
          # Fail here, loudly, rather than three minutes later inside a Docker
          # build with an error message that never mentions LFS.
          if ! file frontend/assets/favicon.png | grep -q 'PNG image'; then
            echo "LFS files are still pointer stubs after git lfs pull:"
            file frontend/assets/*.png
            exit 1
          fi
          echo "LFS assets materialised:"
          file frontend/assets/*.png

      - name: Build and start this commit
        run: |
          set -euo pipefail

          # Fail here rather than three minutes later after a pointless build.
          if [ -z "${ENV_FILE:-}" ] || [ ! -r "$ENV_FILE" ]; then
            echo "DEPLOY_ENV_FILE is unset or unreadable by this runner: '${ENV_FILE:-}'"
            exit 1
          fi

          # Tag what is live now, before it is overwritten. This is the only
          # thing that makes the rollback step below possible.
          if docker image inspect "$IMAGE:latest" >/dev/null 2>&1; then
            ROLLBACK="$IMAGE:rollback-$(date -u +%Y%m%d_%H%M%S)"
            docker tag "$IMAGE:latest" "$ROLLBACK"
            echo "ROLLBACK_TAG=$ROLLBACK" >> "$GITHUB_ENV"
            echo "Tagged current image as $ROLLBACK"
          fi

          # --no-cache because stage 1 runs `expo export`: a cached layer ships
          # a stale web bundle behind a fresh backend, which is precisely the
          # failure that broke signup in production once already.
          docker build --no-cache -t "$IMAGE:latest" .

          docker stop "$CONTAINER" || true
          docker rm "$CONTAINER" || true
          docker run -d --name "$CONTAINER" --restart unless-stopped \
            --env-file "$ENV_FILE" -p "$PORT_BIND" "$IMAGE:latest"

      - name: Wait for readiness
        run: |
          set -euo pipefail
          # /api/v1/ready checks the database, unlike /health which is liveness
          # only. A container that boots but cannot reach Postgres is a failed
          # deploy, not a healthy one.
          for i in $(seq 1 36); do
            if curl -fsS --max-time 5 http://127.0.0.1:7860/api/v1/ready >/dev/null; then
              echo "Ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Never became ready within 180s"
          docker logs --tail 50 "$CONTAINER" || true
          exit 1

      - name: Roll back if the new build never came up
        if: failure() && env.ROLLBACK_TAG != ''
        run: |
          set -euo pipefail
          echo "Rolling back to $ROLLBACK_TAG"
          docker stop "$CONTAINER" || true
          docker rm "$CONTAINER" || true
          docker run -d --name "$CONTAINER" --restart unless-stopped \
            --env-file "$ENV_FILE" -p "$PORT_BIND" "$ROLLBACK_TAG"
          # Deliberately not gated on readiness: this image was serving traffic
          # a few minutes ago, and a failed rollback needs a human either way.

      - name: Prune old rollback images
        if: always()
        run: |
          set -euo pipefail
          # Every deploy leaves a tagged image behind. Unchecked, they fill the
          # disk and take production down by a route nobody is watching.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^$IMAGE:rollback-" | sort -r | tail -n +6 \
            | xargs -r -n1 docker rmi || true
          docker image prune -f || true
